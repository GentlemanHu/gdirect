[package]
name = "gdirect"
version = "0.9.1"
edition = "2024"
description = "Browse, transfer and mount Google Drive with native Google authentication"
license = "GPL-2.0-or-later"

[features]
default = ["web"]
web = ["dep:rust-embed"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
scraper = "0.24"
url = "2"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sha2 = "0.11"
base64 = "0.22"
getrandom = "0.3"
md-5 = "0.11"
unicode-width = "0.2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
axum = { version = "0.8" }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
bytes = "1"
futures-util = "0.3"
rust-embed = { version = "8", optional = true }
mime_guess = "2"
chrono = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
hex = "0.4"
jsonwebtoken = "11.1.0"

[build-dependencies]
cc = "1"
